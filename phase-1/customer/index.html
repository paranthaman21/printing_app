<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barath Store - Printing Service</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        .hero {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .hero img {
            max-width: 200px;
            height: auto;
        }

        .upload-area {
            border: 2px dashed #93c5fd;
            /* Soft blue dashed */
            background: #eff6ff;
            border-radius: 16px;
            padding: 2.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: #dbeafe;
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            fill: var(--primary);
        }

        .upload-hint {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* Trust Badges */
        .trust-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .trust-item {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-color);
            background: #f1f5f9;
            padding: 0.75rem 0.25rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .trust-icon {
            width: 20px;
            height: 20px;
            fill: var(--accent);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Barath Store</h1>
            <div class="subtitle">Printing Service</div>

            <div class="hero">
                <!-- Using the copied hero image -->
                <img src="../static/img/hero.png" alt="Printing Service Illustration">
            </div>

            <form onsubmit="handleUpload(event)">
                <div class="form-group">
                    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                        <!-- Cloud Upload Icon SVG -->
                        <svg class="upload-icon" viewBox="0 0 24 24">
                            <path
                                d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" />
                        </svg>
                        <div style="font-weight: 600; font-size: 1.1rem; color: var(--primary)">Tap to upload document
                        </div>
                        <div class="upload-hint">PDF, JPG, PNG supported</div>
                        <input type="file" id="fileInput" accept=".pdf, .jpg, .jpeg, .png" required
                            style="display: none;" onchange="handleFileSelect(this)">
                    </div>
                    <div id="selectedFileName" class="text-center"
                        style="margin-top: 10px; font-weight: 500; display: none;"></div>
                </div>

                <button type="submit">Start Printing</button>

                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="loading-text" id="loadingText">Uploading... 0%</div>
            </form>

            <div class="trust-grid">
                <div class="trust-item">
                    <svg class="trust-icon" viewBox="0 0 24 24">
                        <path
                            d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z" />
                    </svg>
                    <span>Fast Printing</span>
                </div>
                <div class="trust-item">
                    <svg class="trust-icon" viewBox="0 0 24 24">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />
                    </svg>
                    <span>Pickup at Store</span>
                </div>
                <div class="trust-item">
                    <svg class="trust-icon" viewBox="0 0 24 24">
                        <path
                            d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
                    </svg>
                    <span>Secure Upload</span>
                </div>
            </div>
            <div style="margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; text-align: center;">
                <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1rem;">Policies & Legal</p>
                <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
                    <a href="terms.html"
                        style="color: #475569; text-decoration: none; font-size: 0.85rem; padding: 0.5rem 1rem; background: #f8fafc; border-radius: 6px; transition: all 0.2s;">Terms
                        & Conditions</a>
                    <a href="privacy.html"
                        style="color: #475569; text-decoration: none; font-size: 0.85rem; padding: 0.5rem 1rem; background: #f8fafc; border-radius: 6px; transition: all 0.2s;">Privacy
                        Policy</a>
                    <a href="refund.html"
                        style="color: #475569; text-decoration: none; font-size: 0.85rem; padding: 0.5rem 1rem; background: #f8fafc; border-radius: 6px; transition: all 0.2s;">Refund
                        Policy</a>
                </div>
            </div>
        </div>
    </div>
    <script src="../static/js/main.js"></script>
    <script>
        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                const name = input.files[0].name;
                const display = document.getElementById('selectedFileName');
                display.textContent = "Selected: " + name;
                display.style.display = 'block';
                display.style.color = '#2563eb';
            }
        }
    </script>
</body>

</html>
