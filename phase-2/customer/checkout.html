<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Barath Store</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        .order-summary-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .badge-price {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--accent);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .summary-item {
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .summary-title {
            font-weight: 600;
            color: var(--text-color);
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            padding-right: 60px;
            /* Space for badge */
            word-break: break-all;
        }

        .input-icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-wrapper svg {
            position: absolute;
            left: 1rem;
            width: 20px;
            height: 20px;
            fill: #94a3b8;
        }

        .input-icon-wrapper input {
            padding-left: 3rem;
            /* Space for icon */
        }
    </style>
</head>

<body onload="initCheckoutPage()">
    <div class="container">
        <div class="card">
            <h2>Checkout</h2>

            <div class="order-summary-card">
                <div class="badge-price" id="summaryTotal">₹0</div>
                <div class="summary-title" id="summaryFile">Filename.pdf</div>
                <div class="summary-item" id="summaryDetails">Loading details...</div>
            </div>

            <form onsubmit="handleCheckout(event)">
                <div class="form-group">
                    <label>Your Name</label>
                    <div class="input-icon-wrapper">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                        </svg>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Mobile Number</label>
                    <div class="input-icon-wrapper">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z" />
                        </svg>
                        <input type="tel" id="phone" placeholder="9876543210" required pattern="[0-9]{10}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Payment Method</label>
                    <div class="option-grid"
                        style="grid-template-columns: 1fr 1fr; margin-bottom: 1rem; display: flex; justify-content: space-between; gap: 1rem;">
                        <div class="option-card active" onclick="selectPayment('PAY_AT_SHOP', this)" id="pay-shop"
                            style="border: 2px solid var(--border-color); padding: 1rem; border-radius: 12px;">
                            <svg class="icon" viewBox="0 0 24 24"
                                style="width: 28px; height: 28px; margin-bottom: 8px; fill: var(--primary);">
                                <path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 6H6v-6h6v6z" />
                            </svg>
                            <div class="opt-title">Pay at Shop</div>
                        </div>
                        <div class="option-card" onclick="selectPayment('UPI', this)" id="pay-upi"
                            style="border: 2px solid var(--border-color); padding: 1rem; border-radius: 12px;">
                            <svg class="icon" viewBox="0 0 24 24"
                                style="width: 28px; height: 28px; margin-bottom: 8px; fill: var(--primary);">
                                <path
                                    d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z" />
                            </svg>
                            <div class="opt-title">Pay via UPI</div>
                        </div>
                    </div>

                    <!-- Hidden input to store selected method -->
                    <input type="hidden" id="paymentMethod" value="PAY_AT_SHOP">

                    <!-- QR Code Section -->
                    <div id="upi-section"
                        style="display: none; background: #fff; border: 2px solid var(--border-color); border-radius: 12px; padding: 1.5rem; text-align: center; margin-bottom: 1.5rem;">
                        <div style="margin-bottom: 1rem; font-weight: 600; color: var(--primary);">Scan & Pay ₹<span
                                id="upiAmount">0</span></div>

                        <div id="payment-qrcode" style="display: flex; justify-content: center; margin-bottom: 1rem;">
                        </div>

                        <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 1rem;">
                            UPI ID: <span id="upiIdDisplay"></span><br>
                            Or use any UPI App
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1rem; display: flex; align-items: start; gap: 10px;">
                    <input type="checkbox" id="termsConsent" required
                        style="width: 20px; height: 20px; margin-top: 2px;">
                    <label for="termsConsent" style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.4;">
                        I agree to the <a href="terms.html" target="_blank" style="color: var(--primary);">Terms &
                            Conditions</a> and <a href="privacy.html" target="_blank"
                            style="color: var(--primary);">Privacy Policy</a>.
                    </label>
                </div>

                <button type="submit" id="submitBtn">Place Order</button>
            </form>
            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8rem;">
                <a href="legal.html" style="color: #94a3b8; text-decoration: none;">Legal & Privacy</a>
            </div>
        </div>
    </div>

    <!-- QRCode Lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="../static/js/main.js"></script>
    <script>
        // Inline Logic for Payment Selection
        let appConfig = {};

        async function fetchConfig() {
            try {
                const res = await fetch('/api/config');
                appConfig = await res.json();
            } catch (e) { console.error("Config fetch failed", e); }
        }

        // Custom Init
        const originalInitCheck = initCheckoutPage;
        initCheckoutPage = async function () {
            await fetchConfig();
            originalInitCheck();

            // Set amount for UPI display
            const priceData = JSON.parse(localStorage.getItem('printPrice'));
            if (priceData) {
                document.getElementById('upiAmount').textContent = priceData.price;
            }
        };

        function selectPayment(method, el) {
            document.getElementById('paymentMethod').value = method;

            // UI Toggle
            document.querySelectorAll('.option-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');

            const upiSection = document.getElementById('upi-section');
            const submitBtn = document.getElementById('submitBtn');

            if (method === 'UPI') {
                upiSection.style.display = 'block';
                submitBtn.innerText = "I've Paid";
                generateUPIQR();
            } else {
                upiSection.style.display = 'none';
                submitBtn.innerText = "Place Order";
            }
        }

        function generateUPIQR() {
            const upiContainer = document.getElementById('payment-qrcode');
            upiContainer.innerHTML = ""; // Clear prev

            const priceData = JSON.parse(localStorage.getItem('printPrice'));
            const amount = priceData ? priceData.price : 0;
            const shopName = appConfig.shop_name || "Barath Store";
            const upiId = appConfig.upi_id;

            document.getElementById('upiIdDisplay').textContent = upiId;

            // UPI URL format
            // pa=address, pn=name, am=amount, tn=note
            const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(shopName)}&am=${amount}&tn=PrintOrder&cu=INR`;

            new QRCode(upiContainer, {
                text: upiUrl,
                width: 180,
                height: 180,
                colorDark: "#000000",
                colorLight: "#ffffff"
            });
        }
    </script>
</body>

</html>
